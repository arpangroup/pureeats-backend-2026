name: Deploy backend API

# SSHes into the PureEats server and has the server itself pull the latest
# code, rebuild the Spring Boot jar, and restart the systemd service. No
# build happens on the runner - keeps this workflow fast and simple.
# See setup-server.sh in the server-setup repo for how the server, deploy
# user, and pureeats-api systemd service were provisioned.
on:
  push:
    branches: [feature/26.08.30-initial-dev-3]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-api
  cancel-in-progress: true

env:
  DEPLOY_USER: pureeats-deploy
  APP_DIR: /home/pureeats-deploy/apps/pureeats-backend-2026
  # Must match the branch above (and the clone in setup-server.sh) - update
  # both together if the deploy branch changes (e.g. once this merges to main).
  BRANCH: feature/26.08.30-initial-dev-3
  # Non-secret runtime settings, passed through as VM arguments to the app
  # (see setup-server.sh's ExecStart: --spring.profiles.active / --logging.file.name /
  # --pureeats.media.local.base-dir). Written below to a file the deploy user
  # owns - not the root-only secrets env file - so these can change per
  # deploy with no extra sudo grant needed.
  SPRING_PROFILE: prod
  LOG_FILE: /var/log/pureeats/pureeats-api.log
  MEDIA_LOCAL_BASE_DIR: /var/lib/pureeats/uploads

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build, and restart on the server
        run: |
          ssh "${DEPLOY_USER}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -e

            cd ${APP_DIR}
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
            git reset --hard origin/${BRANCH}
            mvn -q -pl pureeats-app -am package -DskipTests

            echo "SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}" > /etc/pureeats/pureeats-api-runtime.env
            echo "LOG_FILE=${LOG_FILE}" >> /etc/pureeats/pureeats-api-runtime.env
            echo "MEDIA_LOCAL_BASE_DIR=${MEDIA_LOCAL_BASE_DIR}" >> /etc/pureeats/pureeats-api-runtime.env

            sudo systemctl restart pureeats-api
          EOF
