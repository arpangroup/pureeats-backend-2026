spring:
  datasource:
    url: jdbc:h2:mem:pureeats_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost

pureeats:
  jwt:
    secret: test-only-secret-key-for-integration-tests-minimum-32-bytes
    expiration-ms: 86400000

security:
  geolocation:
    enabled: false
  otp:
    resend-cooldown-seconds: 0
    expiry-minutes: 10
    max-attempts: 3

notification:
  email-provider: console
  sms-provider: console

logging:
  level:
    com.pureeats: WARN
