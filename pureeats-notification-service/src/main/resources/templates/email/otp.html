<!doctype html>
<html lang="en">
<body style="font-family: Arial, sans-serif; background:#f7f7f7; padding:24px;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <h2 style="color:#1a1a1a;margin-top:0;">Hello {{userName}},</h2>
    <p style="color:#444;font-size:15px;">Your PureEats verification code is:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px;color:#e63946;margin:24px 0;">{{otp}}</p>
    <p style="color:#666;font-size:13px;">This code is valid for {{expiryMinutes}} minutes. If you did not request this, you can safely ignore this email.</p>
  </div>
</body>
</html>
